<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กระดานเติมไฟ อวท.</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 fill=%22%23ff5722%22>🔥</text></svg>">
    <style>
        /* --- ตั้งค่าสีและดีไซน์ --- */
        body { 
            font-family: 'Kanit', sans-serif; 
            background-color: #121212; 
            color: #ffffff; 
            margin: 0; 
            padding: 20px; 
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { 
            text-align: center; 
            color: #ff5722; 
            text-transform: uppercase; 
            border-bottom: 2px solid #333; 
            padding-bottom: 10px; 
            font-weight: 600;
        }
        
        /* กล่องพิมพ์ข้อความ */
        .input-box { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        textarea { 
            width: 100%; height: 80px; 
            background: #2d2d2d; color: #fff; 
            border: 1px solid #444; border-radius: 4px; 
            padding: 10px; box-sizing: border-box; 
            resize: none; margin-bottom: 10px; 
            font-family: 'Kanit', sans-serif; 
            font-size: 1em;
        }
        textarea:focus { outline: none; border-color: #ff5722; }
        
        /* ปุ่มส่งข้อความ */
        button { 
            background: #ff5722; color: white; 
            border: none; padding: 10px 15px; 
            border-radius: 4px; cursor: pointer; 
            font-weight: 500; width: 100%; transition: 0.3s; 
            font-family: 'Kanit', sans-serif;
            font-size: 1em;
        }
        button:hover { background: #e64a19; }
        button:disabled { background: #555; cursor: not-allowed; }
        
        /* ฟีดข้อความที่อนุมัติแล้ว */
        .feed { display: flex; flex-direction: column; gap: 15px; }
        .card { 
            background: #1e1e1e; padding: 15px; 
            border-radius: 8px; border-left: 4px solid #ff5722; 
        }
        .card-meta { font-size: 0.85em; color: #888; margin-bottom: 8px; }
        .card-text { font-size: 1.1em; line-height: 1.5; margin-bottom: 15px; font-weight: 300; }
        
        /* ปุ่มเติมไฟ */
        .card-actions { display: flex; justify-content: flex-end; }
        .btn-fire { 
            background: transparent; border: 1px solid #ff5722; 
            color: #ff5722; width: auto; padding: 5px 15px; border-radius: 20px; 
            font-family: 'Kanit', sans-serif;
        }
        .btn-fire:hover:not(:disabled) { background: #ff5722; color: white; }
        .btn-fire:disabled { border-color: #555; color: #555; background: transparent; }

        /* --- ระบบแจ้งเตือน (Toast) --- */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px 20px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            border-bottom: 3px solid #ff5722;
            font-weight: 400;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }
        #toast.show {
            visibility: visible;
            bottom: 50px;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 กระดานเติมไฟ อวท.</h1>
        
        <div class="input-box">
            <textarea id="msgInput" placeholder="พิมพ์ข้อเสนอแนะ หรือระบายความในใจที่นี่... (แอดมินคัดกรองก่อนขึ้นจอ)"></textarea>
            <button id="sendBtn" onclick="sendMessage()">ส่งข้อความ</button>
        </div>

        <div id="loading" style="text-align: center; color: #ff5722; display: none;">กำลังโหลดข้อมูล... ⏳</div>

        <div class="feed" id="feedContainer">
            </div>
    </div>

    <div id="toast">ข้อความแจ้งเตือน</div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyMiIeWM-IEo5E41cCnVcIgKQjhvfhJ5WIXDQdTysjFZqKoFgh-sNiMpkl9kIVDKmhVFw/exec";

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.classList.add("show");
            setTimeout(() => {
                toast.classList.remove("show");
            }, 3000);
        }

        async function loadData() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('feedContainer').innerHTML = '';
            
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                data.forEach(item => {
                    createCard(item);
                });
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('feedContainer').innerHTML = '<p style="color:red; text-align:center;">ระบบหลังบ้านกำลังซ่อมบำรุง</p>';
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function createCard(item) {
            const feed = document.getElementById('feedContainer');
            const card = document.createElement('div');
            card.className = 'card';
            
            const date = new Date(item.timestamp).toLocaleDateString('th-TH');
            const isVoted = localStorage.getItem('voted_' + item.id);
            const btnText = isVoted ? `🔥 โหวตแล้ว (${item.upvote})` : `🔥 เติมไฟ (${item.upvote})`;
            const btnDisabled = isVoted ? 'disabled' : '';

            card.innerHTML = `
                <div class="card-meta">📅 ${date}</div>
                <div class="card-text">${item.message}</div>
                <div class="card-actions">
                    <button class="btn-fire" id="btn-${item.id}" ${btnDisabled} onclick="upvote(${item.id})">
                        ${btnText}
                    </button>
                </div>
            `;
            feed.prepend(card);
        }

        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const btn = document.getElementById('sendBtn');
            const msg = input.value.trim();

            if (!msg) {
                showToast("พิมพ์อะไรสักหน่อยสิวัยรุ่น!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "กำลังส่ง... ⏳";

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    body: JSON.stringify({ action: "add", message: msg })
                });
                
                showToast("ส่งสำเร็จ! รอแอดมิน อวท. ตรวจสอบครับ"); 
                input.value = ""; 
            } catch (error) {
                showToast("เกิดข้อผิดพลาด เน็ตอาจจะหลุด!"); 
            } finally {
                btn.disabled = false;
                btn.innerText = "ส่งข้อความ";
            }
        }

        async function upvote(id) {
            const btn = document.getElementById(`btn-${id}`);
            
            // 🛠️ แก้บั๊ก: อ่านจำนวนโหวตเดิมออกมาก่อนที่ข้อความบนปุ่มจะเปลี่ยน!
            let currentVote = 0;
            const match = btn.innerText.match(/\d+/);
            if (match) {
                currentVote = parseInt(match[0]);
            }

            // ล็อกปุ่มทันทีเพื่อตัดกระแสไฟกันสแปมรัว
            btn.disabled = true;
            btn.innerText = "กำลังเติมไฟ... 🔥";

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ action: "upvote", id: id })
                });
                
                // ถ้ายิงข้อมูลเข้า Google สำเร็จ ให้ล็อกสถานะถาวร
                localStorage.setItem('voted_' + id, true);
                btn.innerText = `🔥 โหวตแล้ว (${currentVote + 1})`;
                showToast("เติมไฟให้เพื่อนเรียบร้อย!"); 
            } catch (error) {
                // จะเข้าเงื่อนไขนี้ต่อเมื่อเน็ตดับหรือระบบล่มจริงๆ เท่านั้น
                showToast("กดโหวตไม่สำเร็จ เน็ตหลุดหรือเปล่า?"); 
                btn.disabled = false; 
                btn.innerText = `🔥 เติมไฟ (${currentVote})`;
            }
        }

        loadData();
    </script>
</body>
</html>
