<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>???????????? ???.</title>
    <style>
        /* --- ?????????????????? --- */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; 
            color: #ffffff; 
            margin: 0; 
            padding: 20px; 
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { 
            text-align: center; 
            color: #ff5722; 
            text-transform: uppercase; 
            border-bottom: 2px solid #333; 
            padding-bottom: 10px; 
        }
        
        /* ????????????????? */
        .input-box { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        textarea { 
            width: 100%; height: 80px; 
            background: #2d2d2d; color: #fff; 
            border: 1px solid #444; border-radius: 4px; 
            padding: 10px; box-sizing: border-box; 
            resize: none; margin-bottom: 10px; 
        }
        textarea:focus { outline: none; border-color: #ff5722; }
        
        /* ?????????????? */
        button { 
            background: #ff5722; color: white; 
            border: none; padding: 10px 15px; 
            border-radius: 4px; cursor: pointer; 
            font-weight: bold; width: 100%; transition: 0.3s; 
        }
        button:hover { background: #e64a19; }
        button:disabled { background: #555; cursor: not-allowed; }
        
        /* ???????????????????????? */
        .feed { display: flex; flex-direction: column; gap: 15px; }
        .card { 
            background: #1e1e1e; padding: 15px; 
            border-radius: 8px; border-left: 4px solid #ff5722; 
        }
        .card-meta { font-size: 0.8em; color: #888; margin-bottom: 8px; }
        .card-text { font-size: 1.1em; line-height: 1.4; margin-bottom: 15px; }
        
        /* ?????????? */
        .card-actions { display: flex; justify-content: flex-end; }
        .btn-fire { 
            background: transparent; border: 1px solid #ff5722; 
            color: #ff5722; width: auto; padding: 5px 15px; border-radius: 20px; 
        }
        .btn-fire:hover:not(:disabled) { background: #ff5722; color: white; }
        .btn-fire:disabled { border-color: #555; color: #555; background: transparent; }
    </style>
</head>
<body>
    <div class="container">
        <h1>?? ???????????? ???.</h1>
        
        <div class="input-box">
            <textarea id="msgInput" placeholder="??????????????? ???????????????????????... (???????????????????????)"></textarea>
            <button id="sendBtn" onclick="sendMessage()">??????????</button>
        </div>

        <div id="loading" style="text-align: center; color: #ff5722; display: none;">???????????????... ?</div>

        <div class="feed" id="feedContainer">
            </div>
    </div>

    <script>
        // ?? ????????: ??? URL ????????? Apps Script ??????????????????????????????????!
        const API_URL = "???_URL_WEB_APP_??????";

        // ????????????? Google Sheets ????????????????
        async function loadData() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('feedContainer').innerHTML = '';
            
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                // ????????????????????????? (???????????????????)
                data.forEach(item => {
                    createCard(item);
                });
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('feedContainer').innerHTML = '<p style="color:red; text-align:center;">??????????????????????????</p>';
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        // ???????????????????????
        function createCard(item) {
            const feed = document.getElementById('feedContainer');
            const card = document.createElement('div');
            card.className = 'card';
            
            // ??????????
            const date = new Date(item.timestamp).toLocaleDateString('th-TH');
            
            // ???? LocalStorage ?????????????????????????????????????????
            const isVoted = localStorage.getItem('voted_' + item.id);
            const btnText = isVoted ? `?? ???????? (${item.upvote})` : `?? ?????? (${item.upvote})`;
            const btnDisabled = isVoted ? 'disabled' : '';

            card.innerHTML = `
                <div class="card-meta">?? ${date}</div>
                <div class="card-text">${item.message}</div>
                <div class="card-actions">
                    <button class="btn-fire" id="btn-${item.id}" ${btnDisabled} onclick="upvote(${item.id})">
                        ${btnText}
                    </button>
                </div>
            `;
            feed.prepend(card); // ??????????????????????????
        }

        // ???????????????????????
        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const btn = document.getElementById('sendBtn');
            const msg = input.value.trim();

            if (!msg) {
                alert("??????????????????????????!");
                return;
            }

            // ???????????????????????
            btn.disabled = true;
            btn.innerText = "????????... ?";

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "add", message: msg })
                });
                
                const result = await response.json();
                if(result.status === "success") {
                    alert("????????????????! ???????? ???. ????????????????????????");
                    input.value = ""; // ????????????????
                }
            } catch (error) {
                alert("????????????????????????????");
            } finally {
                btn.disabled = false;
                btn.innerText = "??????????";
            }
        }

        // ????????????????
        async function upvote(id) {
            const btn = document.getElementById(`btn-${id}`);
            btn.disabled = true;
            btn.innerText = "???????????... ??";

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "upvote", id: id })
                });
                
                const result = await response.json();
                if(result.status === "success") {
                    // ?????????????????????????????
                    localStorage.setItem('voted_' + id, true);
                    
                    // ?????????????????? 1 ??????????????????
                    let currentVote = parseInt(btn.innerText.match(/\d+/)[0]);
                    btn.innerText = `?? ???????? (${currentVote + 1})`;
                }
            } catch (error) {
                alert("??????????????? ?????????");
                btn.disabled = false;
                btn.innerText = "?? ??????";
            }
        }

        // ??????????????????????????????????
        loadData();
    </script>
</body>
</html>
